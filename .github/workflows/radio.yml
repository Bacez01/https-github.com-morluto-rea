name: Build Radio Monde

on:
  push:
    paths:
      - "radio/**"
      - ".github/workflows/radio.yml"
  pull_request:
    paths:
      - "radio/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadioMonde.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radio-monde-apk
          path: radio/RadioMonde.apk

      # Direct download link, always the latest version:
      # https://github.com/<owner>/<repo>/releases/download/radio-monde/RadioMonde.apk
      - name: Publish the APK as a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete radio-monde --yes --cleanup-tag || true
          gh release create radio-monde RadioMonde.apk \
            --target "$GITHUB_SHA" \
            --title "Radio Monde" \
            --notes "Touchez RadioMonde.apk ci-dessous pour le télécharger, puis ouvrez-le pour installer l'application."

      # Encrypted copy of the APK pushed back to the branch, so it can be handed over privately.
      # Only the holder of the private key matching apk-delivery/public-key.pem can decrypt it.
      - name: Commit an encrypted copy of the APK
        if: github.event_name == 'push' && hashFiles('apk-delivery/public-key.pem') != ''
        working-directory: .
        run: |
          openssl rand -out aes.key 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in radio/RadioMonde.apk -out apk-delivery/RadioMonde.apk.enc -pass file:aes.key
          openssl pkeyutl -encrypt -pubin -inkey apk-delivery/public-key.pem -pkeyopt rsa_padding_mode:oaep -in aes.key -out apk-delivery/aes.key.enc
          rm aes.key
          sha256sum radio/RadioMonde.apk | cut -d' ' -f1 > apk-delivery/RadioMonde.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-delivery
          git commit -m "Encrypted Radio Monde APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
