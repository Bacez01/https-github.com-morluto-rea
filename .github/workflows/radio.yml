name: Build Radio Monde

on:
  push:
    paths:
      - "radio/**"
      - ".github/workflows/radio.yml"
  pull_request:
    paths:
      - "radio/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadioMonde.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radio-monde-apk
          path: radio/RadioMonde.apk
