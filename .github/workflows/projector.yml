name: Build Mini Projector APK

on:
  push:
    paths:
      - "projector/**"
      - ".github/workflows/projector.yml"
  pull_request:
    paths:
      - "projector/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiniProjector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mini-projector-apk
          path: projector/MiniProjector.apk
